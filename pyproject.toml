[project]
name = "rh-workflow-desk"
version = "0.3.2"
description = "Local RunningHub workflow desk for Web and Electron."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rh-cli"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.uv.sources]
rh-cli = { path = "cli", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests"]
pythonpath = [".", "cli/src"]
